[package]
name = "coqui_engine"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
plist = "1.8"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
ts-rs = { version = "11.1.0", features = ["serde-compat"] }

[dev-dependencies]
tempfile = "3.20"


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSFileManager", "NSString", "NSURL", "NSError"] }
